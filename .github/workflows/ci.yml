name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...
      - name: Cross-compile every CLI target
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./cmd/astrogopng
            echo "built $t"
          done
