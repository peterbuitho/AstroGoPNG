# Builds the astrogopng CLI and GUI natively on Windows, macOS (Apple
# Silicon) and Linux (x86-64 + ARM64), and attaches the archives to a GitHub
# Release. Both now link astropng-core (github.com/peterbuitho/astropng-core,
# pinned in third_party/astropng-core/VERSION) via cgo, which is why this
# builds natively per target instead of cross-compiling the CLI from one
# runner as before: cgo needs a real C/Rust toolchain for the target it's
# building for.
#
# Push a tag like `v0.1.0`, or run the workflow manually.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.ver.outputs.value }}
    steps:
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, goos: windows, ext: .exe }
          - { name: linux-x86_64, os: ubuntu-24.04, goos: linux, ext: "" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, goos: linux, ext: "" }
          - { name: macos-arm64, os: macos-latest, goos: darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Build astropng-core
        shell: bash
        run: bash scripts/build-core.sh

      - name: Build CLI
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.version.outputs.value }}" \
            -o "astrogopng${{ matrix.ext }}" ./cmd/astrogopng

      - name: Build GUI
        working-directory: gui
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          LD="-s -w -X main.version=${{ needs.version.outputs.value }}"
          # No console window when the .exe is double-clicked. -H handles the
          # internal/MinGW linker; -extldflags forces it for other C linkers.
          [[ "${{ matrix.goos }}" == "windows" ]] && LD="$LD -H windowsgui -extldflags=-Wl,--subsystem,windows"
          go build -trimpath -ldflags "$LD" -o "../astrogopng-gui${{ matrix.ext }}" .

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            app="dist/AstroGoPNG.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp astrogopng-gui "$app/Contents/MacOS/astrogopng-gui"
            iconset="$(mktemp -d)/i.iconset"; mkdir -p "$iconset"
            for s in 16 32 128 256 512; do
              sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
              sips -z $((s*2)) $((s*2)) assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/astrogopng.icns"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>AstroGoPNG</string>
            <key>CFBundleIdentifier</key><string>io.github.peterbuitho.astrogopng</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleExecutable</key><string>astrogopng-gui</string>
            <key>CFBundleIconFile</key><string>astrogopng</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
            codesign --force --deep --sign - "$app" || true
            cp README.md astrogopng dist/
            (cd dist && zip -r -y "astrogopng-${{ matrix.name }}.zip" AstroGoPNG.app astrogopng README.md)
            rm -rf dist/AstroGoPNG.app dist/astrogopng dist/README.md
          elif [[ "${{ matrix.goos }}" == "windows" ]]; then
            7z a "dist/astrogopng-${{ matrix.name }}.zip" astrogopng.exe astrogopng-gui.exe README.md
          else
            tar -czf "dist/astrogopng-${{ matrix.name }}.tar.gz" astrogopng astrogopng-gui README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
