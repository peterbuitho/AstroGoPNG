# Cross-compiles the astrogopng CLI for Windows, macOS (Intel + Apple Silicon)
# and Linux (x86-64 + ARM64) from a single runner (pure Go, CGO_ENABLED=0) and
# attaches the archives to a GitHub Release.
#
# Push a tag like `v0.1.0`, or run the workflow manually.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Derive version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + package all targets
        env:
          VERSION: ${{ steps.ver.outputs.value }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A NAMES=(
            [windows/amd64]=windows-x86_64
            [windows/arm64]=windows-aarch64
            [linux/amd64]=linux-x86_64
            [linux/arm64]=linux-aarch64
            [darwin/amd64]=macos-x86_64
            [darwin/arm64]=macos-aarch64
          )
          for t in "${!NAMES[@]}"; do
            name="${NAMES[$t]}"
            out="build/$name"
            mkdir -p "$out"
            bin="astrogopng"
            [[ "$t" == windows/* ]] && bin="astrogopng.exe"
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out/$bin" ./cmd/astrogopng
            cp README.md "$out/"
            if [[ "$t" == windows/* ]]; then
              (cd "$out" && zip -q "$GITHUB_WORKSPACE/dist/astrogopng-$name.zip" "$bin" README.md)
            else
              tar -czf "dist/astrogopng-$name.tar.gz" -C "$out" "$bin" README.md
            fi
          done
          ls -la dist

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: dist/*
          if-no-files-found: error
