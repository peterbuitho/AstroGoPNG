# Cross-compiles the astrogopng CLI for Windows, macOS (Intel + Apple Silicon)
# and Linux (x86-64 + ARM64) from a single runner (pure Go, CGO_ENABLED=0) and
# attaches the archives to a GitHub Release.
#
# Push a tag like `v0.1.0`, or run the workflow manually.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.ver.outputs.value }}
    steps:
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  gui:
    name: GUI — ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, goos: windows, ext: .exe }
          - { name: linux-x86_64, os: ubuntu-24.04, goos: linux, ext: "" }
          - { name: macos-arm64, os: macos-latest, goos: darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build GUI
        working-directory: gui
        shell: bash
        run: |
          LD="-s -w -X main.version=${{ needs.version.outputs.value }}"
          # No console window when the .exe is double-clicked. -H handles the
          # internal/MinGW linker; -extldflags forces it for other C linkers.
          [[ "${{ matrix.goos }}" == "windows" ]] && LD="$LD -H windowsgui -extldflags=-Wl,--subsystem,windows"
          go build -trimpath -ldflags "$LD" -o "../astrogopng-gui${{ matrix.ext }}" .
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "darwin" ]]; then
            app="dist/AstroGoPNG.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp astrogopng-gui "$app/Contents/MacOS/astrogopng-gui"
            iconset="$(mktemp -d)/i.iconset"; mkdir -p "$iconset"
            for s in 16 32 128 256 512; do
              sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
              sips -z $((s*2)) $((s*2)) assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/astrogopng.icns"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>AstroGoPNG</string>
            <key>CFBundleIdentifier</key><string>io.github.peterbuitho.astrogopng</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleExecutable</key><string>astrogopng-gui</string>
            <key>CFBundleIconFile</key><string>astrogopng</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
            codesign --force --deep --sign - "$app" || true
            cp README.md dist/
            (cd dist && zip -r -y "astrogopng-gui-macos-arm64.zip" AstroGoPNG.app README.md)
            rm -rf dist/AstroGoPNG.app dist/README.md
          elif [[ "${{ matrix.goos }}" == "windows" ]]; then
            7z a "dist/astrogopng-gui-${{ matrix.name }}.zip" astrogopng-gui.exe README.md
          else
            tar -czf "dist/astrogopng-gui-${{ matrix.name }}.tar.gz" astrogopng-gui README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  cli:
    name: CLI — cross-compile all targets
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build + package all CLI targets
        env:
          VERSION: ${{ needs.version.outputs.value }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A NAMES=(
            [windows/amd64]=windows-x86_64
            [windows/arm64]=windows-aarch64
            [linux/amd64]=linux-x86_64
            [linux/arm64]=linux-aarch64
            [darwin/amd64]=macos-x86_64
            [darwin/arm64]=macos-aarch64
          )
          for t in "${!NAMES[@]}"; do
            name="${NAMES[$t]}"
            out="build/$name"
            mkdir -p "$out"
            bin="astrogopng"
            [[ "$t" == windows/* ]] && bin="astrogopng.exe"
            GOOS="${t%/*}" GOARCH="${t#*/}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out/$bin" ./cmd/astrogopng
            cp README.md "$out/"
            if [[ "$t" == windows/* ]]; then
              (cd "$out" && zip -q "$GITHUB_WORKSPACE/dist/astrogopng-cli-$name.zip" "$bin" README.md)
            else
              tar -czf "dist/astrogopng-cli-$name.tar.gz" -C "$out" "$bin" README.md
            fi
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [cli, gui]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.cli.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
